server.port=8090
spring.application.name=thariga-mart

# ---------- AI Shopping Assistant ----------
# The assistant reads its OpenAI API key from the OPENAI_API_KEY environment
# variable at runtime. The key is never stored in this file and is never sent
# to the browser. Set it before starting the app, e.g. (Windows PowerShell):
#   $env:OPENAI_API_KEY="sk-..."   then run the app
# Without the key the assistant still recommends products from the catalogue.

# ---------- MySQL 8 ----------
spring.datasource.url=jdbc:mysql://localhost:3306/thariga_mart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=thariga_user
spring.datasource.password=ABC@123

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---------- SQL Initialization ----------
spring.sql.init.mode=never

# ---------- JWT ----------
app.jwt.secret=TharigaMartSuperSecretJWTSigningKey2026ChangeMePlease
app.jwt.expiration-ms=86400000

# ---------- Password reset tokens ----------
app.reset.token-ttl-minutes=30